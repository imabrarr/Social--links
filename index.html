<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to Abrar's World</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#020307;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-5;background:#020307}
body:after{content:"";position:fixed;inset:0;z-index:-4;pointer-events:none;background:radial-gradient(circle at 50% 35%,#17223833,transparent 55%),radial-gradient(circle at 10% 80%,#7d001822,transparent 35%)}
.web{position:fixed;width:270px;height:270px;border-radius:50%;z-index:-2;opacity:.25;pointer-events:none;background:repeating-radial-gradient(circle,transparent 0 20px,#b8c6e955 21px 22px);clip-path:polygon(50% 0,58% 30%,82% 8%,68% 37%,100% 50%,68% 58%,88% 88%,58% 68%,50% 100%,40% 68%,10% 90%,32% 58%,0 50%,32% 38%,10% 10%,40% 30%);animation:pulse 5s infinite}
.w1{top:-70px;left:-70px}.w2{right:-80px;bottom:-80px}.w3{right:-150px;top:25%;transform:scale(.65)}
@keyframes pulse{50%{opacity:.42;transform:scale(1.05)}}
.fog{position:fixed;width:60vw;height:25vh;border-radius:50%;filter:blur(35px);opacity:.13;z-index:-1;background:#b7c6d8;animation:fog 11s ease-in-out infinite alternate}
.f1{left:-20%;top:35%}.f2{right:-20%;bottom:15%;animation-delay:-5s}@keyframes fog{to{transform:translate(25vw,-5vh) scale(1.2)}}
.wrap{width:min(720px,92%);margin:auto;text-align:center}.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.k{font-size:13px;letter-spacing:8px;color:#aeb8ca;margin-bottom:20px}.title{font:clamp(48px,13vw,92px)/.95 Georgia,serif;letter-spacing:-3px}.title span{display:block;background:linear-gradient(90deg,#eee,#93aaff,#eee);-webkit-background-clip:text;color:transparent}
.enter{margin-top:42px;width:245px;height:58px;border:1px solid #8fa8ff;border-radius:40px;display:grid;place-items:center;color:#fff;text-decoration:none;letter-spacing:5px;font-size:13px;background:#070b1488;box-shadow:0 0 25px #7894ff22;transition:.3s}.enter:hover{transform:translateY(-4px);box-shadow:0 0 35px #7894ff55}
.quote{margin-top:32px;width:min(560px,100%);padding:18px;border:1px solid #8da2cc44;border-radius:18px;background:#05081288}.quote b{color:#91a9ff;font-weight:normal}.line{height:1px;background:#91a9ff;width:0;margin:14px auto 0;animation:grow 4s linear infinite}@keyframes grow{to{width:100%}}
.scroll{margin-top:48px;color:#7f899c;font-size:10px;letter-spacing:7px;animation:bob 1.8s infinite}.arrow{font-size:26px;margin-top:7px}@keyframes bob{50%{transform:translateY(8px)}}
.social{padding:70px 0 45px}.st{font-size:12px;letter-spacing:7px;color:#b7bfd0;margin-bottom:28px}.cards{display:grid;gap:16px}
.card{position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;padding:21px 23px;text-align:left;border:1px solid #8297d066;border-radius:22px;background:#060a14c9;color:#fff;text-decoration:none;transition:.35s}.card:hover{transform:translateY(-5px);border-color:#91aaff;box-shadow:0 0 30px #7894ff2b}
.icon{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:#090d17;border:1px solid #687aa7;font-size:25px}.name{font-weight:700;letter-spacing:3px;font-size:15px}.desc{color:#9299aa;margin-top:5px;font-size:13px}.go{margin-left:auto;color:#9db1ff;font-size:25px}.foot{padding:30px 0;color:#687083;font-size:12px}
.spider{position:fixed;width:35px;height:28px;z-index:4;pointer-events:none;filter:drop-shadow(0 0 7px #8fa8ff88);animation:move var(--d) ease-in-out forwards}
.spider:before{content:"";position:absolute;left:12px;top:7px;width:11px;height:12px;border-radius:50%;background:#08090d;border:1px solid #9aabc9}
.spider:after{content:"";position:absolute;inset:0;background:linear-gradient(25deg,transparent 47%,#9aabc9 49% 51%,transparent 53%),linear-gradient(-25deg,transparent 47%,#9aabc9 49% 51%,transparent 53%),linear-gradient(65deg,transparent 47%,#9aabc9 49% 51%,transparent 53%),linear-gradient(-65deg,transparent 47%,#9aabc9 49% 51%,transparent 53%)}
@keyframes move{0%{transform:translate(-10vw,-10vh) rotate(0) scale(.5);opacity:0}12%{opacity:1}50%{transform:translate(45vw,45vh) rotate(180deg) scale(1)}100%{transform:translate(110vw,95vh) rotate(360deg) scale(.45);opacity:0}}
.meteor{position:fixed;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px #91aaff,0 0 30px #7894ff66;z-index:3;animation:meteor 1.1s linear forwards}
@keyframes meteor{from{transform:translate(-10vw,-10vh);opacity:0}15%{opacity:1}to{transform:translate(115vw,85vh);opacity:0}}
.flash{position:fixed;inset:0;z-index:2;background:radial-gradient(circle,#a9bcff22,transparent 55%);pointer-events:none;animation:flash .45s forwards}@keyframes flash{to{opacity:0}}
@media(max-width:520px){.wrap{width:92%}.k{letter-spacing:6px}.card{padding:18px}.social{padding-top:50px}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="web w1"></div><div class="web w2"></div><div class="web w3"></div><div class="fog f1"></div><div class="fog f2"></div>
<main class="wrap">
<section class="hero">
<div class="k">WELCOME TO</div>
<div class="title">Abrar's <span>World</span></div>
<a class="enter" href="#social">ENTER WORLD</a>
<div class="quote"><div><b>Yesterday</b> you said <b>Tomorrow</b></div><div class="line"></div></div>
<div class="scroll">SCROLL DOWN<div class="arrow">⌄</div></div>
</section>
<section class="social" id="social">
<div class="st">MY SOCIAL LINKS</div>
<div class="cards">
<a class="card" href="https://www.instagram.com/abrarrr.xx" target="_blank" rel="noopener"><div class="icon">◎</div><div><div class="name">INSTAGRAM</div><div class="desc">Connect with me</div></div><div class="go">→</div></a>
<a class="card" href="https://www.snapchat.com/add/theyhates.sahil" target="_blank" rel="noopener"><div class="icon">👻</div><div><div class="name">SNAPCHAT</div><div class="desc">Let's snap</div></div><div class="go">→</div></a>
<a class="card" href="mailto:imabrarr1@gmail.com"><div class="icon">✉</div><div><div class="name">EMAIL</div><div class="desc">imabrarr1@gmail.com</div></div><div class="go">→</div></a>
</div><div class="foot">© 2026 Abrar's World</div>
</section>
</main>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,s=[];
function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;s=Array.from({length:Math.min(190,innerWidth/4)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random(),d:Math.random()*.018+.006}))}
function draw(){x.clearRect(0,0,W,H);for(const q of s){q.a+=q.d;if(q.a>1||q.a<.15)q.d*=-1;x.globalAlpha=q.a;x.fillStyle='#cbd6ed';x.beginPath();x.arc(q.x,q.y,q.r*devicePixelRatio,0,7);x.fill()}x.globalAlpha=1;requestAnimationFrame(draw)}addEventListener('resize',size);size();draw();
function spider(){let e=document.createElement('div');e.className='spider';e.style.left=(Math.random()*80-10)+'vw';e.style.top=(Math.random()*35-10)+'vh';e.style.setProperty('--d',(2.5+Math.random()*3)+'s');document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}
function meteor(){let e=document.createElement('div');e.className='meteor';e.style.left=(Math.random()*55-10)+'vw';e.style.top=(Math.random()*25-10)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
function flash(){let e=document.createElement('div');e.className='flash';document.body.appendChild(e);setTimeout(()=>e.remove(),500)}
setInterval(spider,1000);setInterval(meteor,3500);setInterval(flash,3500);for(let i=0;i<5;i++)setTimeout(spider,i*500);
</script>
</body>
</html>
