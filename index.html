<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mr Abrarr's world — connect with me on Instagram and Snapchat.">
<title>Mr Abrarr's World</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#02040a;color:white;font-family:Georgia,serif;overflow-x:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-3;background:#02040a}.shade{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle,rgba(25,55,110,.18),transparent 48%),linear-gradient(#0002,#0009)}
.meteor{position:fixed;width:150px;height:2px;background:linear-gradient(90deg,transparent,#fff,#75baff);box-shadow:0 0 12px #fff,0 0 25px #58aaff;opacity:0;z-index:-1;transform:rotate(-32deg)}
@keyframes meteor{0%{opacity:0;transform:translate(0,0) rotate(-32deg)}10%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-430px,300px) rotate(-32deg)}}
section{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.inner{animation:up 1.2s ease}.kicker,.tag,.scroll,.enter,.label,.sub,.footer{font-family:Arial,sans-serif}
.kicker{font-size:13px;letter-spacing:7px;opacity:.8}.welcome h1{font-size:clamp(42px,10vw,78px);font-weight:400}.welcome h1 span,.main h2 span{color:#91baff}
.line{width:150px;height:1px;margin:25px auto;background:#9bc8ff;box-shadow:0 0 14px #70aaff}
.enter{display:inline-block;padding:15px 40px;border:1px solid #66b6ff;border-radius:99px;color:#fff;text-decoration:none;font-size:12px;letter-spacing:4px;transition:.3s}.enter:hover{transform:translateY(-3px);box-shadow:0 0 30px #438fff55}
.scroll{position:absolute;bottom:22px;font-size:10px;letter-spacing:4px;opacity:.6}.arrow{display:block;width:11px;height:11px;margin:10px auto;border-right:2px solid white;border-bottom:2px solid white;transform:rotate(45deg);animation:bounce 1.5s infinite}
.main{padding-top:30px}.card{width:min(720px,100%)}.brand{font-style:italic;font-size:25px;color:#b9d5ff;text-shadow:0 0 15px #70aaff;margin-bottom:60px}.main h2{font-size:clamp(42px,9vw,72px);font-weight:400;margin:0}.tag{font-size:11px;letter-spacing:6px;opacity:.7;margin-top:18px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:48px}.link{padding:25px 22px;text-align:left;text-decoration:none;color:white;border:1px solid #bcd4ff45;border-radius:22px;background:#0a122666;backdrop-filter:blur(12px);transition:.35s}.link:hover{transform:translateY(-7px);border-color:#8ec5ff;box-shadow:0 12px 45px #4696ff40}.icon{font:28px Arial;display:block;margin-bottom:12px}.label{font-weight:bold;font-size:12px;letter-spacing:3px}.sub{font-size:12px;opacity:.6;margin-top:7px}.footer{margin-top:55px;font-size:11px;opacity:.5}
@keyframes up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes bounce{50%{transform:rotate(45deg) translate(5px,5px)}}
@media(max-width:600px){.links{grid-template-columns:1fr}.brand{margin-bottom:45px}.welcome h1{font-size:44px}.kicker{letter-spacing:4px}}
</style>
</head>
<body>
<canvas id="space"></canvas><div class="shade"></div><div class="meteor" id="meteor"></div>
<section class="welcome">
<div class="inner"><div class="kicker">WELCOME TO</div><h1>Mr Abrar's world 🌎</h1><div class="line"></div><a class="enter" href="#world">ENTER WORLD</a></div>
<div class="scroll">SCROLL DOWN<div class="arrow"></div></div>
</section>
<section class="main" id="world"><div class="card">
<div class="brand">Mr Abrarr</div><h2>Mr Abrarr's <span>world</span></h2><div class="tag">EXPLORE · CONNECT · DISCOVER</div>
<div class="links">
<a class="link" href="https://www.instagram.com/abrarrr.xx" target="_blank" rel="noopener"><span class="icon">◎</span><span class="label">INSTAGRAM</span><div class="sub">Connect with me</div></a>
<a class="link" href="https://www.snapchat.com/add/theyhates.sahil" target="_blank" rel="noopener"><span class="icon">◉</span><span class="label">SNAPCHAT</span><div class="sub">Let's snap</div></a>
</div><div class="footer">© 2026 Mr Abrarr's World</div>
</div></section>
<script>
const c=document.getElementById('space'),x=c.getContext('2d');let w,h,s=[];
function size(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;s=Array.from({length:Math.min(240,Math.floor(innerWidth/4))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.2,a:Math.random()}))}
function draw(){x.clearRect(0,0,w,h);s.forEach(q=>{q.a+=Math.random()>.5?.015:-.015;q.a=Math.max(.12,Math.min(1,q.a));x.beginPath();x.arc(q.x,q.y,q.r*devicePixelRatio,0,7);x.fillStyle="rgba(240,248,255,"+q.a+")";x.fill()});requestAnimationFrame(draw)}
size();addEventListener("resize",size);draw();
function meteor(){let m=document.getElementById("meteor");m.style.left=(15+Math.random()*75)+"vw";m.style.top=(5+Math.random()*25)+"vh";m.style.animation="none";void m.offsetWidth;m.style.animation="meteor 1.35s ease-out forwards"}
setTimeout(meteor,1800);setInterval(meteor,3500);
</script>
</body></html>
