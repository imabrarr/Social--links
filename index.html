<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrarrr.xx — Social Links</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 20%, #252525 0, #111 38%, #050505 75%);
    }
    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: .5px;
    }
    .bio {
      margin: 0 0 32px;
      color: #bdbdbd;
      font-size: 15px;
    }
    .links {
      display: grid;
      gap: 16px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 0 24px;
      border-radius: 18px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      background: rgba(55,55,55,.78);
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
      transition: transform .2s ease, background .2s ease;
    }
    .link:hover {
      transform: translateY(-3px);
      background: rgba(75,75,75,.9);
    }
    .icon {
      margin-right: 12px;
      font-size: 25px;
    }
    footer {
      margin-top: 30px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>@abrarrr.xx</h1>
    <p class="bio">My social links</p>

    <div class="links">
      <a class="link" href="https://www.instagram.com/abrarrr.xx" target="_blank" rel="noopener noreferrer">
        <span class="icon">◎</span> Instagram
      </a>

      <a class="link" href="https://www.snapchat.com/add/theyhates.sahil" target="_blank" rel="noopener noreferrer">
        <span class="icon">👻</span> Snapchat
      </a>
    </div>

    <footer>© 2026 Abrar</footer>
  </main>
</body>
</html>
